name: Build native host

# A06 模式：Go 编译 → 三层冒烟 → 二进制 commit 回仓库。
# npm-publish.yml 通过 workflow_run 挂在本 workflow 之后（顺序化，
# 保证 npm 上的包永远含最新二进制）。
on:
  push:
    branches: [main]
    paths:
      - 'native-host/**'
      - 'package.json'
      - '.github/workflows/build-host.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'native-host/**'
      - '.github/workflows/build-host.yml'
  workflow_dispatch:

permissions:
  contents: write   # 提交二进制回仓库 + tag 时建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # 版本一致性：Go 里的 Version 常量必须与 package.json 对齐
      - name: 版本一致性检查
        shell: bash
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          GO_V=$(grep -oP 'Version\s*=\s*"\K[^"]+' native-host/internal/commands/commands.go)
          echo "package.json=$PKG_V / go=$GO_V"
          [ "$PKG_V" = "$GO_V" ] || { echo "::error::版本号不一致（package.json vs commands.go）"; exit 1; }

      - name: Go build
        working-directory: native-host
        shell: bash
        run: go build -ldflags="-s -w" -trimpath -o tabboard-host.exe .

      # 三层冒烟
      - name: Smoke (binary CLI)
        working-directory: native-host
        shell: bash
        run: |
          ./tabboard-host.exe version
          ./tabboard-host.exe --help

      - name: Smoke (stdio protocol)
        working-directory: native-host
        shell: bash
        run: node test/stdio-smoke.mjs

      - name: Smoke (JS resolver)
        shell: bash
        run: |
          NX_TB_HOST_BINARY="$(pwd)/native-host/tabboard-host.exe" node -e "
            const p = require('./src/modules/tb/service.js');
          " 2>/dev/null || true
          NX_TB_HOST_BINARY="$(pwd)/native-host/tabboard-host.exe" node -e "
            import('./src/modules/tb/service.js').then(m => {
              const bin = m.hostBinaryPath();
              console.log('resolved:', bin);
              const { execSync } = require('child_process');
              const out = execSync('\"' + bin + '\" --json version', { encoding: 'utf8' });
              if (!JSON.parse(out).data?.version) throw new Error('not responsive');
              console.log('JS resolver smoke OK');
            });
          "

      - name: 二进制 commit 回仓库
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p binaries/win32-x64
          cp native-host/tabboard-host.exe binaries/win32-x64/tabboard-host.exe
          git add binaries/
          if git diff --cached --quiet; then
            echo "二进制未变化"
          else
            git commit -m "chore(binary): update native host [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tabboard-host-windows
          path: native-host/tabboard-host.exe
          if-no-files-found: error
